<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CanvasJS Technical Indicators: playground</title>
<style>
  body { margin: 0; padding: 24px; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2933; background: #f5f7fa; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 16px; color: #52606d; }
  #toolbar { display: flex; flex-wrap: wrap; gap: 8px 24px; margin-bottom: 16px; }
  .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .group-title { margin-right: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #7b8794; }
  button { padding: 4px 12px; border: 1px solid #cbd2d9; border-radius: 999px; background: #fff; color: #3e4c59; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  button.active { border-color: #2962ff; background: #e8efff; color: #2962ff; }
  #chartContainer { background: #fff; border: 1px solid #e4e7eb; border-radius: 8px; }
</style>
<script src="https://cdn.canvasjs.com/canvasjs.stock.min.js"></script>
<script src="../src/technical-indicators-core.js"></script>
<script src="../src/indicators/simple-moving-average.js"></script>
<script src="../src/indicators/exponential-moving-average.js"></script>
<script src="../src/indicators/bollinger-bands.js"></script>
<script src="../src/indicators/volume-weighted-average-price.js"></script>
<script src="../src/indicators/relative-strength-index.js"></script>
<script src="../src/indicators/moving-average-convergence-divergence.js"></script>
<script src="../src/indicators/stochastic-oscillator.js"></script>
<script src="../src/indicators/average-true-range.js"></script>
<script src="../src/indicators/on-balance-volume.js"></script>
<script type="text/javascript">
var baseChartHeight = 560;
var heightPerPane = 150;
var seed = 12345;
var indicatorChoices = [
  { label: "SMA 20", configuration: { type: "sma", period: 20 } },
  { label: "EMA 50", configuration: { type: "ema", period: 50 } },
  { label: "Bollinger 20, 2", configuration: { type: "bollinger", period: 20, standardDeviations: 2 } },
  { label: "VWAP", configuration: { type: "vwap", reset: "none", volumeChartIndex: 1, volumeSeriesIndex: 0 } },
  { label: "RSI 14", configuration: { type: "rsi", period: 14 } },
  { label: "MACD 12/26/9", configuration: { type: "macd", fast: 12, slow: 26, signal: 9 } },
  { label: "Stochastic 14/3/3", configuration: { type: "stochastic", period: 14, smoothing: 3, signalPeriod: 3 } },
  { label: "ATR 14", configuration: { type: "atr", period: 14 } },
  { label: "OBV", configuration: { type: "obv", volumeChartIndex: 1, volumeSeriesIndex: 0 } }
];
var activeCount = { pane: 0 };

function nextRandomNumber() {
  seed = (seed * 1664525 + 1013904223) % 4294967296;
  return seed / 4294967296;
}

function createSampleData() {
  var priceDataPoints = [];
  var volumeDataPoints = [];
  var navigatorDataPoints = [];
  var closePrice = 180;
  var currentDate = new Date(2026, 0, 5);

  for(var i = 0; i < 220; i++) {
    var openPrice = closePrice;
    var candleColor = "";

    closePrice = openPrice * (1 + (nextRandomNumber() - 0.48) * 0.03);
    candleColor = closePrice >= openPrice ? "#26A69A" : "#EF5350";
    priceDataPoints.push({ x: new Date(currentDate.getTime()), y: [openPrice, Math.max(openPrice, closePrice) * 1.006, Math.min(openPrice, closePrice) * 0.994, closePrice], color: candleColor });
    volumeDataPoints.push({ x: new Date(currentDate.getTime()), y: Math.round(2000000 + nextRandomNumber() * 4000000), color: candleColor });
    navigatorDataPoints.push({ x: new Date(currentDate.getTime()), y: closePrice });
    currentDate.setDate(currentDate.getDate() + 1);
  }

  return { price: priceDataPoints, volume: volumeDataPoints, navigator: navigatorDataPoints };
}

window.onload = function() {
  var data = createSampleData();
  var container = document.getElementById("chartContainer");
  var toolbar = document.getElementById("toolbar");
  var groups = { overlay: null, pane: null };

  container.style.height = baseChartHeight + "px";

  var stockChart = new CanvasJS.StockChart("chartContainer", {
    theme: "light2",
    rangeSelector: { enabled: false },
    charts: [{
      toolTip: { shared: true },
      axisX: { crosshair: { enabled: true, snapToDataPoint: true } },
      axisY: { prefix: "$" },
      legend: { verticalAlign: "top", horizontalAlign: "left" },
      data: [{ type: "candlestick", name: "Price", dataPoints: data.price }]
    }, {
      height: 90,
      axisX: { crosshair: { enabled: true, snapToDataPoint: true } },
      data: [{ type: "column", name: "Volume", dataPoints: data.volume }]
    }],
    navigator: { data: [{ dataPoints: data.navigator }] }
  });

  stockChart.render();

  // One call: reads the data already in the chart options and returns a handle
  var indicatorSet = TechnicalIndicators.apply(stockChart, []);

  function createConfiguration(choice, identifier) {
    var configuration = { id: identifier };

    for(var propertyName in choice.configuration) {
      if(Object.prototype.hasOwnProperty.call(choice.configuration, propertyName)) {
        configuration[propertyName] = choice.configuration[propertyName];
      }
    }

    return configuration;
  }

  function createToggleHandler(button, choice, identifier) {
    var isPane = (TechnicalIndicators.getPlacement(choice.configuration.type) === "pane");

    return function() {
      var isActive = (button.className === "active");

      activeCount.pane += isPane ? (isActive ? -1 : 1) : 0;
      container.style.height = (baseChartHeight + activeCount.pane * heightPerPane) + "px";
      button.className = isActive ? "" : "active";

      if(isActive) {
        indicatorSet.remove(identifier);
      } else {
        indicatorSet.add(createConfiguration(choice, identifier));
      }
    };
  }

  for(var placement in groups) {
    groups[placement] = document.createElement("div");
    groups[placement].className = "group";
    groups[placement].innerHTML = "<span class=\"group-title\">" + (placement === "overlay" ? "Overlays" : "Panes") + "</span>";
    toolbar.appendChild(groups[placement]);
  }

  for(var i = 0; i < indicatorChoices.length; i++) {
    var button = document.createElement("button");

    button.type = "button";
    button.innerHTML = indicatorChoices[i].label;
    button.onclick = createToggleHandler(button, indicatorChoices[i], "choice-" + i);
    groups[TechnicalIndicators.getPlacement(indicatorChoices[i].configuration.type)].appendChild(button);
  }
};
</script>
</head>
<body>
<h1>CanvasJS Technical Indicators</h1>
<p>Click an indicator to add or remove it. Overlays draw on the price chart; panes get their own chart below it.</p>
<div id="toolbar"></div>
<div id="chartContainer"></div>
</body>
</html>
